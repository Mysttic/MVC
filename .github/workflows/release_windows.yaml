name: Release Windows

on:
  push:
    branches:
      - release
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

# There is no `pull_request` trigger here on purpose: nothing in this repository
# runs CI on a pull request, so a pull request into the default branch finishes
# green without a single job having run. Only a push to `release`, or a manual
# dispatch, is allowed to spend Actions minutes.

# This workflow publishes, so a run in flight is never cancelled: a second push
# to `release` queues behind it instead of leaving a release with only some of
# its assets attached. The group sits at WORKFLOW level on purpose - a job-level
# group is evaluated once per matrix job instance, so the four legs of the same
# run would all land in one group and cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      # `fail-fast` deliberately left at its default (true): all four listeners
      # compile the same shared `MVC` class library, so the overwhelmingly
      # common failure is a compile error that fails every leg identically.
      # Letting the first failure cancel the rest saves three full
      # windows-latest builds (billed at 2x) and loses no diagnostic detail.
      matrix:
        # `MVC` dropped from the matrix: it is a class library (no OutputType)
        # that the four listeners pull in through a ProjectReference, so it is
        # already inside every published listener. Its artifact was never
        # downloaded by the `release` job and never shipped in a release.
        project:
          - MVC.MSSQLListener
          - MVC.MySQLListener
          - MVC.OracleListener
          - MVC.PostgreSQLListener

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # The key carries `matrix.project`. Without it all four legs compute
          # the same key: only the leg that wins the first save race ever
          # stores a cache, every later run gets an exact hit so nothing is
          # saved again, and the other three listeners re-download their
          # packages from nuget.org on every single release.
          key: ${{ runner.os }}-nuget-${{ matrix.project }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ matrix.project }}-
            ${{ runner.os }}-nuget-

      # `--force` dropped: it re-downloaded the whole dependency graph on every
      # run and made the cache above pointless.
      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project }}/${{ matrix.project }}.csproj -r win-x64

      # The separate `dotnet build` step is gone: `dotnet publish` builds as
      # well, so the two steps were compiling the same projects twice.
      - name: Publish
        run: dotnet publish ${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release --no-restore -r win-x64 --self-contained --output ./output/${{ matrix.project }}

      # Zipped here instead of in the `release` job, so what travels between the
      # two jobs is the ~20-30 MB .zip that actually ships rather than the
      # ~70-100 MB raw self-contained publish tree. The archive layout is
      # unchanged (one top-level `MVC.*Listener` folder), only the job that
      # creates it moved.
      - name: Compress publish output
        run: Compress-Archive -Path ./output/${{ matrix.project }} -DestinationPath ${{ matrix.project }}.zip

      # Kept on purpose: this artifact is only transport - the one way the
      # `release` job can get at the binaries. Once the release is published
      # the zips live on as release assets, so the last step of `release`
      # deletes this run's artifacts right away and they stop counting against
      # the Actions storage quota. `retention-days: 1` is the fallback for when
      # that step does not run - the artifacts then stay for 24 hours only:
      #  - EVERY 'Re-run failed jobs' depends on them, so it works only within
      #    a day. That covers a failed `release` (re-running just `release`,
      #    far cheaper than four more windows-latest builds) AND a partly
      #    failed `build`: a leg that finished before fail-fast cancelled the
      #    others keeps its artifact from the first attempt and is NOT rebuilt,
      #    so after 24 hours `release` fails on that download. After a day use
      #    'Re-run all jobs', push again, or 'Run workflow' from `release`
      #    (a dispatch reads this file from `release`, so it must carry
      #    `workflow_dispatch` there);
      #  - a re-run keeps `github.run_number`, so it can only finish a release
      #    that was not created yet: if `release` failed AFTER 'Create GitHub
      #    Release', tag v1.0.<run_number> already exists and any re-run fails
      #    with "already_exists". Delete that release and its tag first, or
      #    upload the missing assets by hand;
      #  - a manual dispatch from any branch other than `release` skips the
      #    `release` job, so these artifacts are the ONLY product of that run -
      #    download them from the run page within 24 hours.
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.project }}
          path: ${{ matrix.project }}.zip
          retention-days: 1

  release:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30

    # Guard for `workflow_dispatch`: the 'Run workflow' button defaults to the
    # DEFAULT branch (`master`), and without this check a dispatch from there
    # would publish a non-draft GitHub Release plus a tag built from unreleased
    # code, and burn a `github.run_number`. The `build` job stays dispatchable
    # from any branch; a dispatch from outside `release` now builds and stops.
    # The skipped job reports green, which is intended.
    if: github.ref == 'refs/heads/release'

    # Needed by the last step, which deletes this run's artifacts
    # (`actions: write`). The workflow has no top-level `permissions:` block and
    # one is NOT added there, so `build` keeps the repository default token.
    # A job-level block REPLACES the default in full, so it lists everything
    # this job's GITHUB_TOKEN is used for: `contents: read` for the checkout.
    # The release and its assets are created with the RELEASE_GITHUB_TOKEN
    # secret, not with GITHUB_TOKEN, so no `contents: write` is needed here.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download MSSQLListener artifact
        uses: actions/download-artifact@v4
        with:
          name: output-MVC.MSSQLListener
          path: ./output/MVC.MSSQLListener

      - name: Download MySQLListener artifact
        uses: actions/download-artifact@v4
        with:
          name: output-MVC.MySQLListener
          path: ./output/MVC.MySQLListener

      - name: Download OracleListener artifact
        uses: actions/download-artifact@v4
        with:
          name: output-MVC.OracleListener
          path: ./output/MVC.OracleListener

      - name: Download PostgreSQLListener artifact
        uses: actions/download-artifact@v4
        with:
          name: output-MVC.PostgreSQLListener
          path: ./output/MVC.PostgreSQLListener

      - name: Set up Git
        run: git config --global user.name 'github-actions'

      - name: Get Version Tag
        id: version
        run: echo "::set-output name=tag::v1.0.${{ github.run_number }}"


      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          release_name: Release ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false


      # The .zip files are built by the `build` job and arrive through the
      # downloads above, so there is nothing left to compress here.
      - name: Upload MSSQLListener Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./output/MVC.MSSQLListener/MVC.MSSQLListener.zip
          asset_name: MVC.MSSQLListener.zip
          asset_content_type: application/zip

      - name: Upload MySQLListener Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./output/MVC.MySQLListener/MVC.MySQLListener.zip
          asset_name: MVC.MySQLListener.zip
          asset_content_type: application/zip

      - name: Upload OracleListener Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./output/MVC.OracleListener/MVC.OracleListener.zip
          asset_name: MVC.OracleListener.zip
          asset_content_type: application/zip

      - name: Upload PostgreSQLListener Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./output/MVC.PostgreSQLListener/MVC.PostgreSQLListener.zip
          asset_name: MVC.PostgreSQLListener.zip
          asset_content_type: application/zip

      # The four zips are now release assets, so the transport artifacts from
      # `build` (~20-30 MB each) are deleted instead of sitting in the Actions
      # storage quota until retention expires.
      #  - `if: success()`: when anything above failed the artifacts are kept
      #    (for 1 day) so 'Re-run failed jobs' can still download them - which
      #    finishes the release only if it failed before 'Create GitHub
      #    Release' succeeded (see the comment on 'Upload release package').
      #  - `continue-on-error: true`: a failed cleanup must never turn a
      #    published release red.
      #  - `shell: bash`: this job runs on windows-latest, whose default shell
      #    is pwsh (no `\` line continuation, no xargs); Git Bash is on the
      #    runner. `tr -d '\r'` guards the ids against CRLF line endings.
      - name: Delete this run's artifacts
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id' \
            | tr -d '\r' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
